<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="文献检索平台 - 全球硕博论文 + 学术文献检索，支持知网/万方/万方医学/维普一键跳转，电脑与手机通用">
<title>文献检索平台 · 全球硕博论文 + 学术文献</title>
<style>
/* ============ 基础 ============ */
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#667085; --line:#e3e8f0;
  --primary:#2563eb; --primary-dark:#1e4fc2; --primary-soft:#e8effc;
  --accent:#0ea5e9; --danger:#dc2626; --ok:#16a34a; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.05);
  --radius:12px; --radius-s:8px;
  --header-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
::selection{background:var(--primary-soft)}

/* ============ 顶部栏 ============ */
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:var(--header-h);display:flex;align-items:center;padding:0 18px;gap:14px;max-width:100%;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:var(--text);white-space:nowrap;min-width:0;overflow:hidden}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex-shrink:0}
.brand small{display:block;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.4px;margin-top:-2px}
.topbar .spacer{flex:1}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:7px;border-radius:8px;position:relative;line-height:1}
.icon-btn:hover{background:#f2f5fa;color:var(--primary)}
.icon-btn .badge{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}

/* ============ 搜索区 ============ */
.search-shell{background:linear-gradient(180deg,#eef3fc 0%,var(--bg) 100%);padding:22px 18px 16px}
.search-box{max-width:920px;margin:0 auto}
.search-bar{display:flex;gap:8px;flex-wrap:wrap}
.search-input-wrap{flex:1 1 360px;position:relative;display:flex}
.field-select{padding:0 8px;border:1.5px solid var(--line);border-right:none;border-radius:var(--radius) 0 0 var(--radius);background:#f8fafc;font-size:13.5px;color:#344054;cursor:pointer;min-width:86px;max-width:110px}
.search-input-wrap input{width:100%;padding:12px 44px 12px 14px;border:1.5px solid var(--line);border-radius:0 var(--radius) var(--radius) 0;font-size:15px;background:#fff;transition:border-color .15s, box-shadow .15s;color:var(--text)}
.search-input-wrap input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-input-wrap .clear-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;display:none}
.search-bar .btn-search{padding:12px 26px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.search-bar .btn-search:hover{background:var(--primary-dark)}
.filters{max-width:920px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.filters select,.filters input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff;font-size:13.5px;color:var(--text);min-width:0;flex-shrink:0}
.filters select:focus,.filters input[type=number]:focus{outline:none;border-color:var(--primary)}
.filters label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;min-width:0;flex-shrink:0}
.filters .range{display:flex;align-items:center;gap:6px}
.filters .range input{width:82px}
.search-meta{max-width:920px;margin:8px auto 0;font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-meta .spacer{flex:1}
/* 中文数据库直达 */
.cn-databases{max-width:920px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px dashed #cdd8ec;border-radius:var(--radius);padding:10px 14px}
.cn-label{font-size:13px;color:#344054;font-weight:600;margin-right:2px}
.cn-btn{border:none;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;transition:transform .12s, opacity .12s;flex-shrink:0}
.cn-btn:hover{transform:translateY(-1px);opacity:.9}
.cn-btn:active{transform:scale(.96)}
.cn-cnki{background:#c7254e}
.cn-wanfang{background:#1677ff}
.cn-med{background:#00b96b}
.cn-vip{background:#fa8c16}
.cn-note{font-size:11.5px;color:var(--muted)}

/* ============ 布局 ============ */
.layout{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start;min-width:0}
.layout > *{min-width:0}
@media (max-width:1100px){.layout{grid-template-columns:190px minmax(0,1fr)} .detail-panel{grid-column:1/-1;position:static;margin-top:2px}}
@media (max-width:900px){.layout{grid-template-columns:1fr} .facets-panel{position:static;order:-1}}

/* ============ 结果列表 ============ */
.result-list{display:flex;flex-direction:column;gap:10px;min-width:0}
.paper-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:box-shadow .15s, border-color .15s;position:relative;min-width:0}
.paper-card:hover{border-color:#c9d6ea;box-shadow:0 4px 12px rgba(16,24,40,.08)}
.paper-card.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.paper-card .type-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--primary-soft);color:var(--primary);font-weight:600;margin-bottom:6px}
.paper-card .src-oa{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#f0fdf4;color:#15803d;font-weight:600;margin-bottom:6px;margin-right:5px}
.paper-card .src-cr{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#fef9c3;color:#854d0e;font-weight:600;margin-bottom:6px;margin-right:5px}
.paper-card .degree-tag{background:#eef2ff;padding:2px 8px;border-radius:6px;font-weight:600;color:#4338ca}
.paper-card .vol-iss{background:#f8fafc;padding:2px 8px;border-radius:6px;font-weight:600;color:#475467}
.paper-card .pages{background:#f8fafc;padding:2px 8px;border-radius:6px;font-weight:600;color:#475467}
.paper-card h3{font-size:15.5px;font-weight:600;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paper-card .authors{font-size:13px;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.paper-card .meta-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.paper-card .year{background:#f2f5fa;padding:2px 8px;border-radius:6px;font-weight:600;color:#344054}
.paper-card .journal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paper-card .fav{position:absolute;top:10px;right:10px;border:none;background:none;font-size:16px;cursor:pointer;color:#c6ceda;padding:4px;line-height:1}
.paper-card .fav.on{color:#f59e0b}
.paper-card .fav:hover{transform:scale(1.15)}

/* 骨架屏 */
.skeleton{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.skeleton .sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton .sk.t{height:16px;width:80%}
.skeleton .sk.s{margin-top:8px;width:55%}
.skeleton .sk.m{margin-top:12px;width:35%;height:12px}

/* ============ 详情面板 ============ */
.detail-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:sticky;top:calc(var(--header-h) + 14px);min-height:260px;min-width:0}
@media (max-width:900px){.detail-panel{position:static;margin-top:2px}}
.detail-panel .placeholder{color:var(--muted);text-align:center;padding:46px 16px}
.detail-panel .placeholder .big{font-size:40px;margin-bottom:10px}
.detail-panel .d-type{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;background:var(--primary-soft);color:var(--primary);font-weight:600}
.detail-panel .d-src{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;background:#f0fdf4;color:#15803d;font-weight:600;margin-left:6px}
.detail-panel .d-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.detail-panel .d-year{display:inline-block;font-size:13px;background:#f2f5fa;padding:3px 10px;border-radius:6px;color:#344054;font-weight:600}
.detail-panel .d-degree{display:inline-block;font-size:13px;background:#eef2ff;padding:3px 10px;border-radius:6px;color:#4338ca;font-weight:600}
.detail-panel .d-vol{display:inline-block;font-size:13px;background:#f8fafc;padding:3px 10px;border-radius:6px;color:#475467;font-weight:600}
.detail-panel .d-pages{display:inline-block;font-size:13px;background:#f8fafc;padding:3px 10px;border-radius:6px;color:#475467;font-weight:600}
.detail-panel .d-lang{display:inline-block;font-size:13px;background:#f0fdf4;padding:3px 10px;border-radius:6px;color:#15803d;font-weight:600}
.detail-panel h2{font-size:19px;font-weight:700;line-height:1.45;margin-top:10px}
.detail-panel .d-authors{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.7}
.detail-panel .d-journal{font-size:13.5px;color:var(--muted);margin-top:8px}
.detail-panel .d-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{border-color:#f3c1c1;color:var(--danger)}
.detail-panel .d-abstract{font-size:14px;color:#3d4556;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);line-height:1.85;white-space:pre-wrap;word-break:break-word}
.detail-panel .d-doi{font-size:12.5px;color:var(--muted);margin-top:12px;word-break:break-all}
.detail-panel .d-keywords{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.detail-panel .kw{font-size:12px;background:#f2f5fa;color:#475467;padding:3px 10px;border-radius:20px}

/* ============ 收藏抽屉 ============ */
.drawer-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;opacity:0;visibility:hidden;transition:opacity .2s, visibility .2s}
.drawer-mask.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:#fff;z-index:101;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(16,24,40,.12)}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);gap:10px}
.drawer-head h3{font-size:16px;flex:1}
.drawer-head .cnt{font-size:12px;color:var(--muted);font-weight:400}
.drawer-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.drawer-body .empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.fav-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:#fbfcfe}
.fav-item .info{flex:1;min-width:0}
.fav-item h4{font-size:14px;font-weight:600;line-height:1.45;cursor:pointer;color:var(--text)}
.fav-item h4:hover{color:var(--primary)}
.fav-item .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-item .rm{border:none;background:none;color:#c6ceda;cursor:pointer;font-size:14px;padding:4px;line-height:1}
.fav-item .rm:hover{color:var(--danger)}
.drawer-foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.drawer-foot .btn{flex:1;justify-content:center}

/* ============ 分页 ============ */
.pagination{display:flex;justify-content:center;align-items:center;gap:14px;padding:6px 0 8px;flex-wrap:wrap}
.pagination .btn{padding:7px 16px}
.pagination .info{font-size:12.5px;color:var(--muted)}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:#1c2333;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:200;opacity:0;transition:all .3s;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:86vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ============ 空状态/错误 ============ */
.state-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:42px 20px;text-align:center;color:var(--muted)}
.state-box .big{font-size:36px;margin-bottom:10px}
.state-box h4{font-size:16px;color:var(--text);margin-bottom:6px}

/* ============ 门户导航 ============ */
.nav-bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--header-h);z-index:49;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;width:100%}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:2px;padding:0 14px;min-width:max-content}
.nav-item{padding:12px 16px;font-size:14px;font-weight:500;color:#475467;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;transition:color .15s}
.nav-item:hover{color:var(--primary)}
.nav-item.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.nav-item .nav-ico{margin-right:5px}
/* ============ 学科导航 ============ */
.field-nav{max-width:1280px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;gap:10px}
.field-nav-label{font-size:13px;font-weight:600;color:var(--primary);white-space:nowrap;flex-shrink:0}
.field-nav-list{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;scrollbar-width:thin}
.field-item{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;font-size:12px;color:#475467;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.field-item:hover{border-color:var(--primary);color:var(--primary)}
.field-item.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
@media (max-width:600px){
  .nav-bar{top:var(--header-h)}
  .nav-item{padding:11px 12px;font-size:13px}
}
/* ============ 高级检索 ============ */
.adv-toggle{max-width:920px;margin:8px auto 0;text-align:right}
.adv-toggle button{background:none;border:none;color:var(--primary);font-size:12.5px;cursor:pointer;padding:4px 8px;border-radius:6px}
.adv-toggle button:hover{background:var(--primary-soft)}
.adv-panel{max-width:920px;margin:8px auto 0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:none}
.adv-panel.show{display:block}
.adv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.adv-row:last-child{margin-bottom:0}
.adv-row select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff;font-size:13px;color:var(--text);min-width:0}
.adv-row input{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);font-size:13px;color:var(--text);flex:1;min-width:160px}
.adv-row input:focus{outline:none;border-color:var(--primary)}
.adv-logic{color:var(--muted);font-size:12px;font-weight:600}
.adv-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;padding:6px;border-radius:6px}
.adv-del:hover{background:#fef2f2}
.adv-add{background:none;border:1px dashed var(--line);color:var(--primary);cursor:pointer;font-size:12.5px;padding:7px 14px;border-radius:var(--radius-s);width:100%}
.adv-add:hover{border-color:var(--primary);background:var(--primary-soft)}
/* ============ 分面筛选 ============ */
.facets-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:sticky;top:calc(var(--header-h) + 60px)}
.facet-group{margin-bottom:14px}
.facet-group:last-child{margin-bottom:0}
.facet-title{font-size:13px;font-weight:600;color:#344054;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.facet-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}
.facet-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#475467;cursor:pointer;padding:4px 6px;border-radius:6px}
.facet-item:hover{background:#f5f7fb}
.facet-item input{margin:0;accent-color:var(--primary)}
.facet-item .f-count{color:var(--muted);font-size:11px;margin-left:auto}
.facet-item.on{color:var(--primary);font-weight:600}
.facet-clear{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-left:auto}
.facet-clear:hover{color:var(--danger)}
.facet-year{display:flex;flex-direction:column;gap:4px}
.facet-year input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px}
/* ============ 批量选择 ============ */
.batch-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;margin-bottom:10px;font-size:13px;color:#344054;flex-wrap:wrap}
.batch-bar .sel-all{display:flex;align-items:center;gap:6px;cursor:pointer}
.batch-bar .sel-all input{accent-color:var(--primary)}
.batch-bar .spacer{flex:1}
.batch-bar .btn{padding:6px 12px;font-size:12.5px}
.paper-card.selected{border-color:var(--primary);background:#f5f8ff}
.paper-card .sel-check{position:absolute;top:10px;left:10px;width:16px;height:16px;accent-color:var(--primary);cursor:pointer;z-index:2}
.paper-card{padding-left:34px}
/* ============ 引用格式导出 ============ */
.cite-pop{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.cite-pop.show{display:flex}
.cite-box{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column}
.cite-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.cite-head h3{font-size:15px;flex:1}
.cite-body{flex:1;overflow-y:auto;padding:16px 18px}
.cite-format{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cite-fmt-btn{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;color:#475467}
.cite-fmt-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cite-text{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;font-family:Consolas,Menlo,monospace;white-space:pre-wrap;word-break:break-all;line-height:1.7;max-height:320px;overflow-y:auto}
.cite-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

/* 打印 */
@media print{ .topbar,.search-shell,.pagination,.detail-panel .d-actions,.drawer{display:none!important} body{background:#fff} .layout{max-width:100%;padding:0} .paper-card{border:none;border-bottom:1px solid var(--line);border-radius:0;cursor:default} }

/* ============ 移动端优化 ============ */
@media (max-width:600px){
  :root{--header-h:56px}
  .topbar{padding:0 12px;gap:10px}
  .brand{font-size:16px}
  .search-shell{padding:16px 12px}
  .search-box{min-width:0}
  .search-bar .btn-search{padding:12px 18px}

<script>
"use strict";
/* ================= 配置 ================= */
const CROSSREF_API = "https://api.crossref.org/works";
const OPENALEX_API = "https://api.openalex.org/works";
const UA = "LitSearch/1.0 (mailto:user@example.com)";
const ROWS = 10;                 // 每页条数
const MAX_PAGES = 40;            // 最多翻页数（保护性上限）
// 学位类型通过标题特征前端分类（OpenAlex dissertation 无 degree_type 字段）
const DEGREE_PATTERNS = {
  doctoral:[/ph\.?d/i,/doctoral/i,/d\.?ph\.?d/i,/博士/],
  masters:[/master['’]?s/i,/硕士/],
  bachelors:[/bachelor/i,/undergraduate/i,/本科/]
};
const TYPE_LABEL = {             // 类型显示名
  "journal-article":"期刊论文","proceedings-article":"会议论文","book-chapter":"书籍章节",
  "book":"图书","monograph":"专著","report":"报告","dissertation":"学位论文",
  "preprint":"预印本","dataset":"数据集","posted-content":"网络发布","reference-entry":"百科条目",
  "peer-review":"同行评议","standard":"标准","other":"其他"
};
const SORT_MAP = { relevance:"relevance", published:"published", cited:"cited_by_count" };

/* ================= 状态 ================= */
let state = {
  q:"", field:"all", source:"all", degree:"", yearFrom:"", yearTo:"", sort:"relevance",
  cursor:"*", prevCursor:null, page:1, total:0,
  results:[], active:null, loading:false, sourceTag:"all",
  crCursor:"*", crPrev:null, oaFallback:false, langFilter:"", advConditions:[]   // Crossref 游标（翻页用）
};
let favorites = loadFav();

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const resultList = $("resultList"), detailPanel = $("detailPanel"), pagination = $("pagination");
const qInput = $("q"), clearX = $("clearX");

/* ================= 收藏持久化 ================= */
function loadFav(){
  try{ return JSON.parse(localStorage.getItem("litsearch_fav")||"[]"); }
  catch(e){ return []; }
}
function saveFav(){ localStorage.setItem("litsearch_fav", JSON.stringify(favorites)); }
function isFav(doi){ return favorites.some(f=>f.doi===doi); }
function addFav(item){ if(!isFav(item.doi)){ favorites.unshift(item); saveFav(); renderFavBadge(); renderDrawer(); toast("已收藏 ⭐"); } }
function removeFav(doi){ favorites = favorites.filter(f=>f.doi!==doi); saveFav(); renderFavBadge(); renderDrawer(); toast("已取消收藏"); }

/* ================= 工具函数 ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stripTags(s){ if(!s) return ""; return String(s).replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g," ").trim(); }
function fmtAuthors(list, max){
  if(!list || !list.length) return "佚名";
  const names = list.map(a=>[a.given,a.family].filter(Boolean).join(" "));
  const lim = max || 6;
  if(names.length<=lim) return names.join(", ");
  return names.slice(0,lim).join(", ") + " 等 " + names.length + " 位作者";
}
function yearOf(issued){ if(!issued || !issued["date-parts"] || !issued["date-parts"][0]) return ""; return issued["date-parts"][0][0] || ""; }
function typeLabel(t){ return TYPE_LABEL[t] || (t ? t.replace(/-/g," ") : "文献"); }
function journalOf(item){
  const c = item["container-title"];
  if(c && c[0]) return c[0];
  const p = item["publisher"];
  return p || "";
}
function doiUrl(doi){ return "https://doi.org/" + encodeURIComponent(doi); }
function doiOf(item){ return (item.DOI||"").replace(/^doi:/i,""); }
function normDOI(d){ return String(d||"").trim().toLowerCase().replace(/^doi:\s*/i,""); }
function abstractText(item){
  let a = item.abstract || "";
  if(!a) return "";
  a = stripTags(a);
  if(a.length > 900) a = a.slice(0,900) + " …";
  return a;
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ================= 搜索 ================= */
// ---- OpenAlex 摘要倒排索引还原 ----
function rebuildAbstract(inverted){
  if(!inverted) return "";
  const pos = {};
  for(const word in inverted){
    for(const p of inverted[word]) pos[p] = word;
  }
  const words = [];
  for(let i=0; i<Object.keys(pos).length; i++){
    if(pos[i]) words.push(pos[i]);
  }
  return words.join(" ").replace(/\s+/g," ").trim();
}
// ---- 学位类型分类（标题特征）----
function classifyDegree(title){
  for(const deg of ["doctoral","masters","bachelors"]){
    for(const re of DEGREE_PATTERNS[deg]){
      if(re.test(title)) return deg;
    }
  }
  return "";
}
// ---- OpenAlex 条目标准化 ----
function normalizeOA(item){
  const doi = (item.doi||"").replace("https://doi.org/","");
  const authors = (item.authorships||[]).map(a=>({
    given: a.author?.given_name||"", family: a.author?.display_name||""
  }));
  const inst = item.primary_location?.source?.display_name || "";
  const lang = item.language || "";
  const biblio = item.biblio || {};
  return {
    doi, title:item.title||"（无标题）", authors, issued:{"date-parts":[[item.publication_year]]},
    type:item.type||"dissertation", journal:inst, publisher:item.primary_location?.source?.host_organization||"",
    volume:biblio.volume||"", issue:biblio.issue||"", page:biblio.first_page?`${biblio.first_page}${biblio.last_page?"-"+biblio.last_page:""}`:"", articleNumber:"",
    abstract:rebuildAbstract(item.abstract_inverted_index), url:item.doi||item.landing_page_url||"",
    platform:item.landing_page_url || item.doi || "",
    cited:item.cited_by_count||0, lang:lang,
    degree:classifyDegree(item.title||""),
    source:"openalex", oaId:item.id||""
  };
}
// ---- 出版社地区识别（按名称关键词映射，覆盖欧美/日本/韩国/国内主流出版社） ----
const REGION_RULES = {
  western: [
    // 欧美知名出版社（学术出版集团）
    "elsevier","springer","nature","wiley","oxford","cambridge","sage","taylor & francis","informa","ieee","acm","apa","acs","royal society","annual reviews","emerald","palgrave","macmillan","de gruyter","brill","karger","lippincott","bmj","jama","aaas","plos","mdpi","frontiers","hindawi","iop","institute of physics","amercan physical","aps physics","wolters kluwer","thieme","karger","pearson","prentice","mcgraw","cengage","houghton","hachette","harpercollins","random house","penguin","simon & schuster","university press","mit press","stanford university","harvard university","yale university","john wiley","johns hopkins","duke university","university of chicago","cornell university","princeton university","university of california","w. w. norton","reed-elsevier","lexisnexis","westlaw","european","american","british","washington","london","new york","paris","berlin","amsterdam","usa","u.s.","united states"
  ],
  japan: [
    "springer japan","tokyo","japan","japanese","kyoto","osaka","rikkyo","waseda","keio","nagoya","hokkaido","tohoku","kyushu","hitotsubashi","kobe","tsukuba","jst","j-stage","japan medical","japanese society","nihon","nihon","shogakukan","kadokawa","kobunsha","kodansha","shueisha","iwanami","japan academic","japanese association","japanese pharmacological","tohoku university","the japan","日本","东京","京都","大阪","岩波","講談社","小学馆","角川","日本医学会"
  ],
  korea: [
    "korea","korean","seoul","busan","daegu","incheon","gwangju","daejeon","yonsei","korea university","seoul national","kaist","postech","hanyang","sungkyunkwan","ewha","kyung","publisher co., ltd","한국","서울","대한","한국어"
  ],
  china: [

  ]
};
function matchRegion(name, region){
  if(!name) return false;
  const n = name.toLowerCase();
  if(region==="western"){
    // 欧美：先排除亚洲出版社（日本/韩国/国内关键词命中则不属于欧美）
    const asia = REGION_RULES.japan.concat(REGION_RULES.korea, REGION_RULES.china);
    if(asia.some(k=> n.includes(k.toLowerCase()))) return false;
    return REGION_RULES.western.some(k=> n.includes(k.toLowerCase()));
  }
  const rules = REGION_RULES[region];
  if(!rules) return true;
  return rules.some(k=> n.includes(k.toLowerCase()));
}

// ---- Crossref 条目标准化 ----
function normalizeCR(item){
  const doi = doiOf(item);
  return {
    doi, title:(item.title&&item.title[0])||"（无标题）",
    authors:item.author||[], issued:item.issued, type:item.type||"other",
    journal:journalOf(item), publisher:item.publisher||"",
    volume:item.volume||"", issue:item.issue||"", page:item.page||"",
    articleNumber:item["article-number"]||"",
    abstract:item.abstract||"", url:item.URL||(doi?doiUrl(doi):""),
    // 真实原文平台页面（出版社官网）优先：resource.primary > link[0] > DOI 解析
    platform: item.resource?.primary?.URL || (item.link && item.link[0]?.URL) || item.URL || (doi?doiUrl(doi):""),
    cited:item["is-referenced-by-count"]||0, lang:"", degree:"", source:"crossref"
  };
}
// ---- 构建检索参数 ----
function buildCrossrefParams(){
  const p = new URLSearchParams();
  const q = qInput.value.trim();
  const ftype = state.field || "all";   // all | title | author | doi | publisher
  // 高级检索条件优先（结构化 AND 组合）
  if(state.advConditions && state.advConditions.length){
    const parts = [];
    state.advConditions.forEach(c=>{
      const v = c.val;
      if(c.field==="title") p.set("query.title", v);
      else if(c.field==="author") p.set("query.author", v);
      else if(c.field==="doi") p.set("query.bibliographic", v);
      else if(c.field==="publisher") p.set("query.container-title", v);
      else parts.push(v);
    });
    if(parts.length) p.set("query.bibliographic", parts.join(" "));
  } else if(q){
    if(ftype==="title") p.set("query.title", q);
    else if(ftype==="author") p.set("query.author", q);
    else if(ftype==="doi") p.set("query.bibliographic", q);
    else if(ftype==="publisher") p.set("query.container-title", q);
    else p.set("query.bibliographic", q);
  }
  p.set("rows", ROWS);
  p.set("select", "DOI,title,author,issued,publisher,type,container-title,volume,issue,page,article-number,abstract,URL,resource,link,license,is-referenced-by-count");
  p.set("mailto", "user@example.com");
  const sortPublished = state.sort==="published";
  if(sortPublished){
    // published 排序与 cursor 不兼容，改用 offset 分页
    p.set("offset", ((state.page-1)*ROWS));
  } else {
    p.set("cursor", state.crCursor || "*");
  }
  const flt = [];
  // 门户导航类型过滤（期刊/图书/会议/数据集/预印本）
  const effectiveType = facetSelections.type || navType;
  if(effectiveType) flt.push("type:"+effectiveType);
  if(state.source==="literature" && state.degree==="dissertation") flt.push("type:dissertation");
  // DOI 精确检索：直接查 works/{doi}
  if(ftype==="doi" && q){
    const cleanDoi = q.trim().replace(/^https?:\/\/doi\.org\//i,"").replace(/^doi:\s*/i,"");
    if(/^10\.\d{4,9}\/\S+/.test(cleanDoi)) p.set("filter", "doi:"+cleanDoi);
  }
  const y1 = $("fYearFrom").value.trim(), y2 = $("fYearTo").value.trim();
  if(y1) flt.push("from-pub-date:"+y1+"-01-01");
  if(y2) flt.push("until-pub-date:"+y2+"-12-31");
  if(flt.length) p.set("filter", flt.join(","));
  p.set("sort", SORT_MAP[state.sort]||"relevance");
  if(state.sort==="published") p.set("order", "desc");
  return p;
}
function buildOpenAlexParams(){
  const p = new URLSearchParams();
  const q = qInput.value.trim();
  if(q) p.set("search", q);
  p.set("per-page", ROWS);
  p.set("mailto", "user@example.com");
  p.set("page", state.page);
  const flt = [];
  // 学科导航：按国际学科领域过滤（OpenAlex field）
  if(navField) flt.push("primary_topic.field.id:"+navField);
  // 资源导航类型映射到 OpenAlex 类型
  const oaType = {dissertation:"dissertation", book:"book", "journal-article":"article", "proceedings-article":"article", dataset:"dataset", preprint:"preprint"}[navType];
  if(oaType) flt.push("type:"+oaType);
  else if(state.source==="dissertations") flt.push("type:dissertation");
  if(flt.length===0) flt.push("type:article");
  const y1 = $("fYearFrom").value.trim(), y2 = $("fYearTo").value.trim();
  if(y1) flt.push("from_publication_date:"+y1+"-01-01");
  if(y2) flt.push("to_publication_date:"+y2+"-12-31");
  p.set("filter", flt.join(","));
  if(state.sort==="cited") p.set("sort", "cited_by_count:desc");
  else if(state.sort==="published") p.set("sort", "publication_date:desc");
  return p;
}

async function search(page){
  state.q = qInput.value.trim();
  state.field = $("fField").value;
  state.source = $("fSource").value;
  state.degree = $("fDegree").value;
  state.yearFrom = $("fYearFrom").value.trim();
  state.yearTo = $("fYearTo").value.trim();
  state.sort = $("fSort").value;
  state.region = $("fRegion") ? $("fRegion").value : "";
  if(page===1){ state.cursor="*"; state.prevCursor=null; state.crCursor="*"; state.crPrev=null; state.page=1; }
  state.loading = true;
  renderSkeletons();
  pagination.style.display = "none";
  const started = Date.now();
  try{
    // 学科导航激活时用 OpenAlex（支持学科过滤）；资源导航类型照常
    const useOA = state.source==="dissertations" || state.source==="all" || !!navField;
    const useCR = state.source==="literature" || (state.source==="all" && !navField);
    let oaRes = null, crRes = null, oaLimited = false;
    const jobs = [];
    if(useOA) jobs.push(fetch(OPENALEX_API + "?" + buildOpenAlexParams().toString(), { headers:{"User-Agent":UA} }).then(async r=>{
      if(r.status===429){ oaLimited = true; return null; }
      return r.ok ? r.json() : null;
    }).catch(()=>null));
    if(useCR) jobs.push(fetch(CROSSREF_API + "?" + buildCrossrefParams().toString(), { headers:{"User-Agent":UA} }).then(r=>r.ok?r.json():null).catch(()=>null));
    const settled = await Promise.all(jobs);
    if(useOA) oaRes = settled.shift();
    if(useCR) crRes = settled.shift();
    // dissertations 模式：OA 限流时自动补 Crossref 学位论文兜底
    if(state.source==="dissertations" && oaLimited && !crRes){
      const p = new URLSearchParams();
      p.set("query.bibliographic", qInput.value.trim());
      p.set("rows", ROWS);
      p.set("select", "DOI,title,author,issued,publisher,type,container-title,abstract,URL,resource,link,is-referenced-by-count");
      p.set("mailto", "user@example.com");
      p.set("cursor", state.crCursor || "*");
      p.set("filter", "type:dissertation");
      crRes = await fetch(CROSSREF_API + "?" + p.toString(), { headers:{"User-Agent":UA} }).then(r=>r.ok?r.json():null).catch(()=>null);
      state.oaFallback = true;
    } else {
      state.oaFallback = false;
    }

    let items = [], total = 0;
    state.sourceTag = state.source;
    if(oaRes){
      const oaItems = (oaRes.results||[]).map(normalizeOA);
      items = items.concat(oaItems.map(x=>({...x, _src:"oa"})));
      total += oaRes.meta?.count || 0;
    }
    if(crRes){
      const crItems = (crRes.message?.items||[]).map(normalizeCR);
      const crTag = state.oaFallback ? "cr-diss" : "cr";
      items = items.concat(crItems.map(x=>({...x, _src:crTag})));
      total += crRes.message?.["total-results"] || 0;
      // 游标管理（仅 relevance/cited 排序使用 cursor；published 用 offset）
      if(state.sort !== "published"){
        if(page > state.page){
          state.crPrev = state.crCursor;
          state.crCursor = crRes.message?.["next-cursor"] || null;
        } else if(page < state.page){
          state.crCursor = state.crPrev;
          state.crPrev = null;
        } else {
          state.crCursor = crRes.message?.["next-cursor"] || null;
        }
        state.cursor = state.crCursor;
      }
    }
    // 降级提示：全球学位论文库限流
    if(oaLimited){
      toast("⚠️ 全球学位论文库暂时限流，可稍后重试或切换数据源");
    }
    // 学位类型：OpenAlex 无分级字段，按标题特征做优先排序（非过滤）
    if(state.degree){
      items.sort((a,b)=>{
        const ao = a._src==="oa" && a.degree===state.degree ? 0 : 1;
        const bo = b._src==="oa" && b.degree===state.degree ? 0 : 1;
        return ao - bo;
      });
    }
    // 门户导航类型过滤（Crossref 端已过滤，OpenAlex 前端兜底）
    if(navType && items.some(x=>x._src==="oa")){
      items = items.filter(x=> x._src!=="oa" || x.type===navType);
    }
    // 期刊分面过滤
    if(facetSelections.journal && items.length){
      items = items.filter(x=> x.journal===facetSelections.journal || x.journal.includes(facetSelections.journal));
    }
    // 语言过滤（仅高级检索设置时）
    if(state.langFilter){
      items = items.filter(x=> {
        if(x.lang) return x.lang===state.langFilter;
        return true; // 无语言信息的保留
      });
    }
    // 出版社地区过滤（前端按出版社+期刊名关键词映射，兼容所有数据源）
    if(state.region){
      items = items.filter(x=> matchRegion((x.publisher||"")+" "+(x.journal||""), state.region));
    }
    state.results = items;
    state.total = total;
    state.page = page;
    renderList();
    renderFacets();
    renderBatchBar();
    renderMeta(started);
    if(state.results.length){
      selectResult(0);
    } else {
      renderEmpty("未找到匹配文献","换个关键词或放宽筛选条件试试");
      detailPanel.innerHTML = placeholderHTML();
    }
    pagination.style.display = (state.results.length ? "flex" : "none");
  }catch(err){
    console.error(err);
    state.results = [];
    state.total = 0;
    renderError(err.message);
    renderMeta(started);
    pagination.style.display = "none";
  }finally{
    state.loading = false;
    renderPagination();
  }
}

/* ================= 导出 ================= */
function bibEntry(it){
  const doi = it.doi, y = yearOf(it.issued);
  const t = (it.title||"").replace(/[{}]/g,"").trim();
  const j = (it.journal||it.publisher||"").replace(/[{}]/g,"").trim();
  let typeKey = "misc";
  if(it.type==="journal-article") typeKey = "article";
  else if(it.type==="book"||it.type==="monograph") typeKey = "book";
  else if(it.type==="dissertation"||it._src==="oa") typeKey = (it.degree==="masters"||it.degree==="bachelors") ? "mastersthesis" : "phdthesis";
  const auth = (it.authors||[]).map(a=>`${a.family||""}, ${a.given||""}`.replace(/,\s*$/,"")).join(" and ") || "Anonymous";
  const school = it.journal || it.publisher || "";
  const lines = [
    `@${typeKey}{${doi||"unknown"},`,
    `  title = {${t}},`,
    `  author = {${auth}},`,
    y ? `  year = {${y}},` : "",
    (typeKey==="phdthesis"||typeKey==="mastersthesis") ? (school ? `  school = {${school}},` : "") : (j ? `  journal = {${j}},` : ""),
    it.volume ? `  volume = {${it.volume}},` : "",
    it.issue ? `  number = {${it.issue}},` : "",
    it.page ? `  pages = {${it.page}},` : "",
    it.publisher ? `  publisher = {${it.publisher}},` : "",
    doi ? `  doi = {${doi}},` : "",
    `}`
  ];
  return lines.filter(l=>l!==null && l.trim()!=="").join("\n");
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime+";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 200);
}
function exportBib(items){
  if(!items.length) return toast("没有可导出的文献");
  downloadFile("literature.bib", items.map(bibEntry).join("\n\n"), "application/x-bibtex");
  toast("已导出 "+items.length+" 条 BibTeX");
}
function exportCsv(items){
  if(!items.length) return toast("没有可导出的文献");
  const escCsv = s=>{ s=String(s||""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const head = ["Title","Authors","Year","Type","Journal","Volume","Issue","Pages","Publisher","DOI","URL","Cited"];
  const rows = items.map(it=>[
    escCsv(it.title), escCsv(fmtAuthors(it.authors,10)), escCsv(yearOf(it.issued)),
    escCsv(typeLabel(it.type)), escCsv(it.journal), escCsv(it.volume||""), escCsv(it.issue||""), escCsv(it.page||""),
    escCsv(it.publisher||""), escCsv(it.doi), escCsv(it.url), it.cited
  ].join(","));
  downloadFile("literature.csv", "\ufeff"+[head.join(","), ...rows].join("\n"), "text/csv");
  toast("已导出 "+items.length+" 条 CSV");
}
$("btnExportBib").onclick = ()=>exportBib(favorites);
$("btnExportCsv").onclick = ()=>exportCsv(favorites);

    if(val) conds.push({field, val});
  });

}

/* ================= 分面筛选 ================= */
let facetSelections = { type:"", journal:"" };
let facetData = { types:{}, journals:{} };
function buildFacetData(){
  // 从当前结果统计分面
  const types = {}, journals = {};
  state.results.forEach(it=>{
    const t = typeLabel(it.type);
    types[t] = (types[t]||0) + 1;
    const j = it.journal || "未知来源";
    if(j && j!=="未知来源") journals[j] = (journals[j]||0) + 1;
  });
  facetData.types = Object.entries(types).sort((a,b)=>b[1]-a[1]);
  facetData.journals = Object.entries(journals).sort((a,b)=>b[1]-a[1]).slice(0,8);
}
function renderFacets(){
  buildFacetData();
  // 类型分面
  const typeList = $("facetTypeList");
  if(facetData.types.length){
    typeList.innerHTML = facetData.types.map(([name,count])=>{
      const key = Object.keys(TYPE_LABEL).find(k=>TYPE_LABEL[k]===name) || name;
      const on = facetSelections.type===key ? "on" : "";
      return `<label class="facet-item ${on}">
        <input type="checkbox" data-type="${esc(key)}" ${on?"checked":""}> ${esc(name)}
        <span class="f-count">${count}</span>
      </label>`;
    }).join("");
    typeList.querySelectorAll("input[data-type]").forEach(cb=>{
      cb.onchange = ()=>{
        facetSelections.type = cb.checked ? cb.dataset.type : "";
        renderFacets();
        navType = facetSelections.type;
        if($("advType")) $("advType").value = facetSelections.type;
        search(1);
      };
    });
  } else {
    typeList.innerHTML = `<div style="font-size:12px;color:var(--muted)">暂无数据</div>`;
  }
  // 期刊分面
  const jList = $("facetJournalList");
  if(facetData.journals.length){
    jList.innerHTML = facetData.journals.map(([name,count])=>{
      const on = facetSelections.journal===name ? "on" : "";
      return `<label class="facet-item ${on}">
        <input type="checkbox" data-journal="${esc(name)}" ${on?"checked":""}> ${esc(name.length>22?name.slice(0,22)+"…":name)}
        <span class="f-count">${count}</span>
      </label>`;
    }).join("");
    jList.querySelectorAll("input[data-journal]").forEach(cb=>{
      cb.onchange = ()=>{
        facetSelections.journal = cb.checked ? cb.dataset.journal : "";
        renderFacets();
        search(1);
      };
    });
  } else {
    jList.innerHTML = `<div style="font-size:12px;color:var(--muted)">暂无数据</div>`;
  }
}

/* ================= 引用格式 ================= */
let citeItems = [];
let citeFmt = "gb";
function fmtCiteGB(it){
  const y = yearOf(it.issued);
  const authors = (it.authors||[]).map(a=>`${a.family||""}${a.given?" "+a.given:""}`).join(", ") || "佚名";
  let head = `${authors}. ${it.title}[${it.type==="journal-article"?"J":it.type==="dissertation"?"D":it.type==="book"?"M":it.type==="proceedings-article"?"C":"文献"}]`;
  if(it.journal) head += ` ${it.journal}`;
  if(it.volume||it.issue) head += `, ${it.volume||""}${it.issue?"("+it.issue+")":""}`;
  if(it.page) head += `: ${it.page}`;
  head += `${y?", "+y:""}.`;
  if(it.doi) head += ` DOI: ${it.doi}.`;
  return head;
}
function fmtCiteAPA(it){
  const y = yearOf(it.issued);
  const authors = (it.authors||[]).map((a,i)=>(i===it.authors.length-1 && i>0 ? "& " : "") + (a.family||"") + (a.given?" "+a.given:"")).join(", ") || "Anonymous";
  let head = `${authors} (${y||"n.d."}). ${it.title}`;
  if(it.journal) head += `. ${it.journal}`;
  if(it.volume) head += `, ${it.volume}`;
  if(it.issue) head += `(${it.issue})`;
  if(it.page) head += `, ${it.page}`;
  head += `. ${it.publisher||""}`.trim();
  if(it.doi) head += ` https://doi.org/${it.doi}`;
  return head;
}
function fmtCiteMLA(it){
  const y = yearOf(it.issued);
  const authors = (it.authors||[]).map(a=>`${a.family||""}, ${a.given||""}`).join("; ") || "Anonymous";
  let head = `${authors}. "${it.title}." `;
  if(it.journal) head += `${it.journal}, `;
  if(it.volume) head += `vol. ${it.volume}, `;
  if(it.issue) head += `no. ${it.issue}, `;
  if(y) head += `${y}, `;
  if(it.page) head += `pp. ${it.page}`;
  if(it.doi) head += `, doi:${it.doi}`;
  head += ".";
  return head;
}
function renderCite(){
  const textEl = $("citeText");
  const fmts = {gb:fmtCiteGB, apa:fmtCiteAPA, mla:fmtCiteMLA, bibtex:bibEntry};
  textEl.textContent = citeItems.map(it=>fmts[citeFmt](it)).join("\n\n");
}
function openCitePop(items){
  citeItems = items; citeFmt = "gb";
  document.querySelectorAll(".cite-fmt-btn").forEach(b=>b.classList.toggle("on", b.dataset.fmt==="gb"));
  renderCite();
  $("citePop").classList.add("show");
}
function closeCitePop(){ $("citePop").classList.remove("show"); }
document.querySelectorAll(".cite-fmt-btn").forEach(btn=>{
  btn.onclick = ()=>{
    citeFmt = btn.dataset.fmt;
    document.querySelectorAll(".cite-fmt-btn").forEach(b=>b.classList.toggle("on", b.dataset.fmt===citeFmt));
    renderCite();
  };
});
$("citeClose").onclick = closeCitePop;

$("citeCopy").onclick = ()=>{

    navigator.clipboard.writeText(text).then(()=>toast("已复制到剪贴板 📋")).catch(()=>toast("复制失败"));
